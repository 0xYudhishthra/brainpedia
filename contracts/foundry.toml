[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "ens-contracts/=lib/ens-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
zg_galileo = "${ZG_RPC_URL}"
sepolia = "${ENS_RPC_URL}"

[etherscan]
zg_galileo = { key = "${ZG_EXPLORER_API_KEY}", url = "https://chainscan-galileo.0g.ai/api" }
